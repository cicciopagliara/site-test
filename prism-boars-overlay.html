<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avellino Boars - PRISM Lower Third</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}
body{display:flex;align-items:flex-end}
.bar{position:relative;width:100%;height:15vh;min-height:72px;max-height:162px;display:flex;align-items:center;padding:0 3.5%;color:#fff;background:linear-gradient(90deg,rgba(4,15,8,.97),rgba(11,43,22,.96) 58%,rgba(4,15,8,.94));border-top:3px solid #61d47d;box-shadow:0 -8px 28px rgba(0,0,0,.35);overflow:hidden}
.bar:before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:#61d47d}
.brand{display:flex;align-items:center;gap:1.2vw;min-width:0}
.ball{position:relative;flex:0 0 auto;width:7vh;height:7vh;min-width:42px;min-height:42px;max-width:74px;max-height:74px;border-radius:50%;background:#e87922;box-shadow:0 3px 14px #0008;animation:spin 8s linear infinite}
.ball:before,.ball:after{content:"";position:absolute;inset:0;border:2px solid #2a160a;border-radius:50%}
.ball:before{clip-path:polygon(47% 0,53% 0,53% 100%,47% 100%)}
.ball:after{clip-path:polygon(0 47%,100% 47%,100% 53%,0 53%)}
@keyframes spin{to{transform:rotate(360deg)}}
.copy{line-height:.92;white-space:nowrap}.kicker{font-size:clamp(10px,1.05vw,18px);font-weight:700;letter-spacing:.22em;color:#a9e8b9;margin-bottom:.5vh}.title{font-size:clamp(25px,3.2vw,54px);font-weight:900;letter-spacing:-.04em}.title span{color:#61d47d}
.divider{height:55%;width:1px;background:#ffffff38;margin:0 2.2vw}
.info{min-width:0}.info strong{display:block;font-size:clamp(16px,1.8vw,31px);white-space:nowrap}.info small{display:block;margin-top:.6vh;color:#c6d5ca;font-size:clamp(10px,1vw,17px);white-space:nowrap}
.live{margin-left:auto;display:flex;align-items:center;gap:.65vw;padding:.8vh 1vw;border:1px solid #ffffff42;border-radius:999px;background:#0006;font-size:clamp(11px,1.1vw,19px);font-weight:800;white-space:nowrap}.dot{width:10px;height:10px;border-radius:50%;background:#ff3434;box-shadow:0 0 10px #ff3434;animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.35}}
.sponsor-wrap{margin-left:2.2vw;padding-left:2.2vw;border-left:1px solid #ffffff38;min-width:16vw}.sponsor-label{font-size:clamp(8px,.7vw,12px);font-weight:700;letter-spacing:.18em;color:#a9e8b9;margin-bottom:.45vh}.sponsor{font-size:clamp(16px,1.65vw,29px);font-weight:900;white-space:nowrap;transition:opacity .35s ease,transform .35s ease}.sponsor.hide{opacity:0;transform:translateY(6px)}
.scan{position:absolute;left:0;right:0;height:1px;background:#ffffff13;animation:scan 4s linear infinite}@keyframes scan{from{top:0}to{top:100%}}
</style>
</head>
<body>
<div class="bar">
 <div class="scan"></div>
 <div class="brand">
  <div class="ball"></div>
  <div class="copy"><div class="kicker">BASKETBALL LIVE</div><div class="title">AVELLINO <span>BOARS</span></div></div>
 </div>
 <div class="divider"></div>
 <div class="info"><strong>GAME NIGHT</strong><small>Diretta basket • Avellino Boars</small></div>
 <div class="sponsor-wrap"><div class="sponsor-label">PARTNER</div><div id="sponsor" class="sponsor">HITC</div></div>
 <div class="live"><i class="dot"></i> LIVE</div>
</div>
<script>
const sponsors=["HITC","Europlastik","Alborea","Leonardo Igiene","Betsson","Sammontana","Ciacco Burger","Caffè Moreno"];
let sponsorIndex=0;
const sponsorEl=document.getElementById("sponsor");
setInterval(()=>{
 sponsorEl.classList.add("hide");
 setTimeout(()=>{
  sponsorIndex=(sponsorIndex+1)%sponsors.length;
  sponsorEl.textContent=sponsors[sponsorIndex];
  sponsorEl.classList.remove("hide");
 },350);
},3000);
</script>
</body>
</html>
